[package]
name = "omalook"
version = "0.1.0"
edition = "2021"
authors = ["Adam"]
license = "MIT"
description = "Omarchy-style QML Outlook clone using Microsoft Graph (Rust backend)"

[dependencies]
# HTTP & networking
ureq = { version = "2.9", features = ["json"] }  # Sync HTTP client
reqwest = { version = "0.11", features = ["json"] }  # Async HTTP client
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# OAuth2
oauth2 = "4.4"
url = "2.5"

# Keyring (Linux SecretService)
keyring = "2.1"

# Configuration (TOML)
toml = "0.8"

# SQLite with FTS5
rusqlite = { version = "0.30", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

# File watching (for settings file)
notify = "6.1"

# Qt bindings (cxx-qt) - Phase 2 integration
cxx-qt = { version = "0.10" }
cxx = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Async runtime
tokio = { version = "1.35", features = ["rt", "time", "macros", "sync"] }
async-trait = "0.1"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
urlencoding = "2.1"
base64 = "0.22"
regex = "1.10"
dirs = "7.0.0"

[build-dependencies]
serde_json = "1.0"
# Qt build integration - Phase 2
cxx-qt-build = { version = "0.10" }
cxx-build = "1.0"

[[bin]]
name = "omalook"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = false
# 16 units lets LLVM use many cores; 1 unit (max inlining) is single-threaded for every crate:
# measured on 32 cores, rebuild after an edit 11.5 s -> 3.9 s, clean 46 s -> 39 s, binary 12.6 -> 14.6 MB.
codegen-units = 16
strip = true

[profile.dev]
opt-level = 0
codegen-units = 256
debug = true
