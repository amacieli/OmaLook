# cargo-deny policy (omalook R2.11). Run: cargo deny check advisories bans licenses sources
# Ignore list mirrors scripts/audit-ignore.txt; remove entries as dependencies are upgraded (R4.1).

[graph]
all-features = true

[advisories]
yanked = "warn"
unmaintained = "all"
unsound = "all"
ignore = [
    "RUSTSEC-2026-0258",
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0347",
    "RUSTSEC-2026-0348",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0381",
    "RUSTSEC-2024-0388",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0372",
    "RUSTSEC-2026-0486",
    "RUSTSEC-2026-0386",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0",
    "CDLA-Permissive-2.0", "ISC", "LGPL-2.1-or-later", "MIT", "MPL-2.0",
    "Unicode-3.0", "Unlicense", "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
